events {
    worker_connections 4096;
}

http {
    log_format lb '$remote_addr "$request" status=$status '
                  'upstream=$upstream_addr upstream_status=$upstream_status '
                  'rt=$request_time urt=$upstream_response_time '
                  'xff_sent="$proxy_add_x_forwarded_for" proto=$scheme host=$host';

    access_log /dev/stdout lb;
    error_log /dev/stderr warn;

    upstream appservice_backend {
        least_conn;
        server app1:8080 max_fails=2 fail_timeout=10s;
        server app2:8080 max_fails=2 fail_timeout=10s;
        server app3:8080 max_fails=2 fail_timeout=10s;
    }

    set_real_ip_from 172.24.0.6;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive off;

    server {
        listen 80;

        location / {
            proxy_pass http://appservice_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

      
        }
    }
}