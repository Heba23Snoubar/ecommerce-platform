syntax = "proto3";

option csharp_namespace = "Contracts.Warehouse";
package warehouse.v1;

service WarehouseService {
  rpc GetStock (GetStockRequest) returns (GetStockResponse);
  rpc Reserve  (ReserveRequest)  returns (ReserveResponse);
  rpc Release  (ReleaseRequest)  returns (ReleaseResponse);
  rpc SetStock (SetStockRequest) returns (SetStockResponse);
}

message GetStockRequest {
  string product_id = 1;
}

message GetStockResponse {
  string product_id = 1;
  int32 available = 2;
}

message ReserveItem {
  string product_id = 1;
  int32 quantity = 2;
}

message ReserveRequest {
  string reservation_id = 1;
  repeated ReserveItem items = 2;
}

enum ReserveStatus {
  RESERVE_STATUS_UNSPECIFIED = 0;
  RESERVED = 1;
  INSUFFICIENT_STOCK = 2;
  PRODUCT_NOT_FOUND = 3;
}

message Shortage {
  string product_id = 1;
  int32 requested = 2;
  int32 available = 3;
}

message ReserveResponse {
  ReserveStatus status = 1;
  repeated Shortage shortages = 2;
}

message ReleaseRequest {
  string reservation_id = 1;
}

message ReleaseResponse {
  bool released = 1;
}

message SetStockRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message SetStockResponse {
  bool ok = 1;
}
