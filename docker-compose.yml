# =========================================
# Shared AppService Configuration
# =========================================
x-appservice-common: &appservice-common
  build:
    context: .
    dockerfile: src/AppService/Dockerfile

  environment:
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_URLS: http://+:8080

    # JWT
    JWT_KEY: ${JWT_KEY}
    JWT_ISSUER: ${JWT_ISSUER}
    JWT_AUDIENCE: ${JWT_AUDIENCE}

    # PostgreSQL - Main Application Database
    ConnectionStrings__CatalogDb: "Host=app-db;Port=5432;Database=${APP_DB_NAME};Username=products_role;Password=${PRODUCTS_DB_PASSWORD}"
    ConnectionStrings__CatalogDbReplica: "Host=app-db-replica;Port=5432;Database=${APP_DB_NAME};Username=products_role;Password=${PRODUCTS_DB_PASSWORD}"
    ConnectionStrings__Users: "Host=app-db;Port=5432;Database=${APP_DB_NAME};Username=users_role;Password=${USERS_DB_PASSWORD}"
    ConnectionStrings__Orders: "Host=app-db;Port=5432;Database=${APP_DB_NAME};Username=orders_role;Password=${ORDERS_DB_PASSWORD}"
    ConnectionStrings__Notifications: "Host=app-db;Port=5432;Database=${APP_DB_NAME};Username=notifications_role;Password=${NOTIFICATIONS_DB_PASSWORD}"
    ConnectionStrings__CartDb: "Host=app-db;Port=5432;Database=${APP_DB_NAME};Username=cart_role;Password=${CART_DB_PASSWORD}"

    # Redis
    REDIS_CONNECTION_STRING: "redis:6379,abortConnect=false,connectTimeout=3000"

    # RabbitMQ
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672
    RABBITMQ_USER: ${RABBITMQ_USER}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

    # Warehouse
    Warehouse__Url: http://warehouse:8080

    # Soketi / Pusher
    Pusher__AppId: ${PUSHER_APP_ID:-app-id}
    Pusher__Key: ${PUSHER_APP_KEY:-app-key}
    Pusher__Secret: ${PUSHER_APP_SECRET:-change_me_pusher}
    Pusher__Host: soketi
    Pusher__Port: 6001

  depends_on:
    app-db:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    warehouse:
      condition: service_started
    soketi:
      condition: service_started

  healthcheck:
   test:
     [
       "CMD-SHELL",
       "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && out=$$(cat <&3) && echo \"$$out\" | grep -q \"200 OK\" && echo \"$$out\" | grep -q \"Healthy\"'"
     ]
   interval: 10s
   timeout: 5s
   retries: 5
   start_period: 15s

  restart: unless-stopped


services:

  # =========================================
  # Main Application Database (Primary - Write)
  # =========================================
  app-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${APP_DB_NAME}
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "hot_standby=on"
    volumes:
      - app-db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================================
  # Read Replica Database (Standby - Read Only)
  # =========================================
  app-db-replica:
    image: postgres:16
    environment:
      PGUSER: replicator
      PGPASSWORD: ${REPLICATOR_PASSWORD:-replicator_pw}
    command: |
      bash -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        echo 'Waiting for primary database to be ready...'
        until pg_isready -h app-db -p 5432 -U ${APP_DB_USER}; do sleep 2; done
        echo 'Cloning primary database via pg_basebackup...'
        rm -rf /var/lib/postgresql/data/*
        pg_basebackup -h app-db -D /var/lib/postgresql/data -U replicator -v -P -R -X stream
      fi
      exec docker-entrypoint.sh postgres -c hot_standby=on
      "
    volumes:
      - app-db-replica-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    depends_on:
      app-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================================
  # Warehouse Database
  # =========================================
  warehouse-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB_NAME}
      POSTGRES_USER: ${WAREHOUSE_DB_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
    volumes:
      - warehouse-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_DB_USER} -d ${WAREHOUSE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================================
  # Warehouse gRPC Microservice (Spring Boot)
  # =========================================
  warehouse:
    build:
      context: .
      dockerfile: src/WarehouseServiceJava/Dockerfile
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://warehouse-db:5432/${WAREHOUSE_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${WAREHOUSE_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${WAREHOUSE_DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      warehouse-db:
        condition: service_healthy

  # =========================================
  # AppService Instances
  # =========================================
  app1:
    <<: *appservice-common
    ports:
      - "${APPSERVICE_PORT:-5097}:8080"

  app2:
    <<: *appservice-common
    depends_on:
      app1:
        condition: service_healthy
      app-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      warehouse:
        condition: service_started
      soketi:
        condition: service_started

  app3:
    <<: *appservice-common
    depends_on:
      app1:
        condition: service_healthy
      app-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      warehouse:
        condition: service_started
      soketi:
        condition: service_started

  # =========================================
  # Nginx Load Balancer
  # =========================================
  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    restart: unless-stopped

  # =========================================
  # RabbitMQ Message Broker
  # =========================================
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =========================================
  # Redis Cache
  # =========================================
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis-data:/data

  # =========================================
  # Order Email Background Worker
  # =========================================
  order-worker:
    build:
      context: .
      dockerfile: src/OrderWorker/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      IDEMPOTENCY_DATA_DIR: /app/data
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_IDEMPOTENCY_TTL_HOURS: ${REDIS_IDEMPOTENCY_TTL_HOURS:-168}
    volumes:
      - order-worker-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # =========================================
  # Soketi WebSocket Server (Pusher Protocol)
  # =========================================
  soketi:
    image: quay.io/soketi/soketi:latest
    environment:
      SOKETI_DEBUG: "1"
      SOKETI_METRICS_ENABLED: "1"
      SOKETI_METRICS_SERVER_PORT: "9601"
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID:-app-id}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY:-app-key}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET:-change_me_pusher}
    ports:
      - "${PUSHER_PORT:-6001}:6001"
      - "9601:9601"
    restart: unless-stopped


# =========================================
# Persistent Volumes
# =========================================
volumes:
  app-db-data:
  app-db-replica-data:
  warehouse-db-data:
  rabbitmq-data:
  order-worker-data:
  redis-data: