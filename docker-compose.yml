services:

  # =========================================
  # Main Application Database (Primary - Write)
  # =========================================
  app-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${APP_DB_NAME}
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "hot_standby=on"
    volumes:
      - app-db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================================
  # Read Replica Database (Standby - Read Only)
  # =========================================
  app-db-replica:
    image: postgres:16
    environment:
      PGUSER: replicator
      PGPASSWORD: ${REPLICATOR_PASSWORD:-replicator_pw}
    command: |
      bash -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        echo 'Waiting for primary database to be ready...'
        until pg_isready -h app-db -p 5432 -U ${APP_DB_USER}; do sleep 2; done
        echo 'Cloning primary database via pg_basebackup...'
        rm -rf /var/lib/postgresql/data/*
        pg_basebackup -h app-db -D /var/lib/postgresql/data -U replicator -v -P -R -X stream
      fi
      exec docker-entrypoint.sh postgres -c hot_standby=on
      "
    volumes:
      - app-db-replica-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    depends_on:
      app-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================================
  # Warehouse Database
  # =========================================
  warehouse-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB_NAME}
      POSTGRES_USER: ${WAREHOUSE_DB_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
    volumes:
      - warehouse-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_DB_USER} -d ${WAREHOUSE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================================
  # Warehouse gRPC Microservice (Spring Boot)
  # =========================================
  warehouse:
    build:
      context: .
      dockerfile: src/WarehouseServiceJava/Dockerfile
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://warehouse-db:5432/${WAREHOUSE_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${WAREHOUSE_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${WAREHOUSE_DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      warehouse-db:
        condition: service_healthy
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
# =========================================
# Persistent Volumes
# =========================================
volumes:
  app-db-data:
  app-db-replica-data:
  warehouse-db-data:
  rabbitmq-data: